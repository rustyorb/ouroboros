version: "3.9"

services:
  ouroboros:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent local Drive (state, logs, memory)
      - ouroboros_data:/data/ouroboros
      # Persistent repo clone (avoids re-cloning on restart)
      - ouroboros_repo:/app/ouroboros_repo
    environment:
      DRIVE_ROOT: /data/ouroboros
      REPO_DIR: /app/ouroboros_repo
      PYTHONUNBUFFERED: "1"
    # Optional: limit resources to avoid runaway costs
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g

volumes:
  ouroboros_data:
    driver: local
  ouroboros_repo:
    driver: local
